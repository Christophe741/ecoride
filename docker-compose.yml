services:
  web:
    build: .
    ports:
      - "9092:80"
    restart: always
    volumes:
      - .:/var/www/html
      - /dev/null:/var/www/html/.env.local
    depends_on:
      - db
      - mongo
  db:
    image: mariadb:12.0
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/ecoride.sql:/docker-entrypoint-initdb.d/ecoride.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "9091:80"
    depends_on:
      - db
  mongo:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    ports:
      - "27017:27017"
volumes:
  db_data:
  mongo_data:
